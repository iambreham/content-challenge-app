<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mycreativehq | Leaderboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --cream: #fcfaf5;
      --warm-white: #fffdf9;
      --vanilla: #f6f1e8;
      --lavender: #e9e0fb;
      --blush: #ffe4da;
      --sky: #e3efff;

      --green: #8caf49;
      --green-dark: #789845;
      --green-soft: rgba(140, 175, 73, 0.14);

      --ink: #161616;
      --text: #4b4b4b;
      --muted: #757575;

      --glass: rgba(255, 255, 255, 0.68);
      --border: rgba(255, 255, 255, 0.82);
      --shadow: 0 24px 60px rgba(92, 74, 112, 0.08);

      --nav-bg: rgba(255, 255, 255, 0.8);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: "Inter", sans-serif;
      color: var(--text);
      min-height: 100vh;
      padding: 28px 24px 120px;
      overflow-x: hidden;
      position: relative;
      background:
        radial-gradient(circle at 10% 16%, rgba(255,255,255,0.92), transparent 24%),
        radial-gradient(circle at 88% 14%, rgba(233,224,251,0.76), transparent 20%),
        radial-gradient(circle at 84% 82%, rgba(255,228,218,0.72), transparent 18%),
        radial-gradient(circle at 16% 82%, rgba(227,239,255,0.72), transparent 18%),
        linear-gradient(145deg, var(--cream) 0%, var(--vanilla) 100%);
    }

    .ambient {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 999px;
      filter: blur(36px);
      opacity: 0.72;
    }

    .blob-1 {
      width: 260px;
      height: 260px;
      background: rgba(233, 224, 251, 0.62);
      top: 18px;
      left: 10px;
    }

    .blob-2 {
      width: 240px;
      height: 240px;
      background: rgba(255, 228, 218, 0.58);
      top: 80px;
      right: 80px;
    }

    .blob-3 {
      width: 220px;
      height: 220px;
      background: rgba(227, 239, 255, 0.6);
      bottom: 80px;
      left: 80px;
    }

    .blob-4 {
      width: 280px;
      height: 280px;
      background: rgba(255, 255, 255, 0.74);
      bottom: 10px;
      right: 20px;
    }

    .app {
      position: relative;
      z-index: 1;
      max-width: 820px;
      margin: 0 auto;
    }

    .topbar {
      margin-bottom: 24px;
    }

    .brand {
      margin: 0 0 10px;
      font-family: "Instrument Serif", serif;
      font-size: 28px;
      line-height: 1;
      color: #4e6132;
      letter-spacing: 0.01em;
    }

    .eyebrow {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(22,22,22,0.46);
    }

    .page-title {
      margin: 0;
      font-size: clamp(42px, 5vw, 74px);
      line-height: 0.94;
      letter-spacing: -0.055em;
      color: var(--ink);
      max-width: 720px;
    }

    .welcome {
      margin: 16px 0 0;
      max-width: 760px;
      font-size: 21px;
      line-height: 1.45;
      color: rgba(22,22,22,0.62);
    }

    .loading,
    .error-state {
      display: none;
      padding: 36px 0;
      font-size: 18px;
      font-weight: 700;
      color: rgba(22,22,22,0.62);
    }

    .loading.show,
    .error-state.show {
      display: block;
    }

    .leaderboard {
      display: none;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .table-head,
    .leader-row {
      display: grid;
      grid-template-columns: 92px 1.4fr 1fr 1fr;
      gap: 12px;
      align-items: center;
    }

    .table-head {
      padding: 0 8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(22,22,22,0.48);
    }

    .leader-row {
      border-radius: 26px;
      padding: 22px 20px;
      background: var(--glass);
      border: 1px solid var(--border);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: var(--shadow);
    }

    .rank {
      font-size: 28px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.05em;
      color: var(--ink);
    }

    .name {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--ink);
    }

    .metric {
      font-size: 16px;
      line-height: 1.5;
      color: rgba(22,22,22,0.72);
      font-weight: 600;
    }

    .empty-card {
      border-radius: 28px;
      padding: 28px;
      background: var(--glass);
      border: 1px solid var(--border);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: var(--shadow);
      color: rgba(22,22,22,0.68);
      line-height: 1.7;
      font-size: 16px;
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      width: min(760px, calc(100% - 24px));
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 12px;
      border-radius: 24px;
      background: var(--nav-bg);
      border: 1px solid rgba(255,255,255,0.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 18px 44px rgba(92, 74, 112, 0.12);
    }

    .nav-link {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      height: 58px;
      border-radius: 18px;
      font-size: 15px;
      font-weight: 800;
      color: rgba(22,22,22,0.62);
      background: transparent;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .nav-link.active {
      background: var(--green);
      color: #ffffff;
      box-shadow: 0 10px 20px rgba(120, 152, 69, 0.2);
    }

    @media (max-width: 700px) {
      body {
        padding: 18px 16px 110px;
      }

      .page-title {
        font-size: 44px;
      }

      .welcome {
        font-size: 18px;
      }

      .table-head {
        display: none;
      }

      .leader-row {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .rank {
        font-size: 24px;
      }

      .name {
        font-size: 22px;
      }

      .metric {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="ambient">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <main class="app">
    <section class="topbar">
      <p class="brand">mycreativehq</p>
      <p class="eyebrow">Leaderboard</p>
      <h1 class="page-title">Who’s actually doing the work</h1>
      <p class="welcome">
        Active results from the last 30 days only.
      </p>
    </section>

    <div id="loadingState" class="loading show">Loading leaderboard...</div>
    <div id="errorState" class="error-state"></div>

    <section id="leaderboardContent" class="leaderboard">
      <div class="table-head">
        <div>Rank</div>
        <div>Name</div>
        <div>Challenges Completed</div>
        <div>Current Challenge</div>
      </div>
    </section>

    <div id="emptyState" class="empty-card" style="display:none;">
      Nobody is on the active board right now.
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="./dashboard.html" class="nav-link">Dashboard</a>
    <a href="./challenge.html" class="nav-link">Challenge</a>
    <a href="./history.html" class="nav-link">History</a>
    <a href="./leaderboard.html" class="nav-link active">Leaderboard</a>
  </nav>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      getDocs
    } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDJt-uwfTaIC6WDvg8rlhj4GjpsGOis8TM",
      authDomain: "content-challenge-app.firebaseapp.com",
      projectId: "content-challenge-app",
      storageBucket: "content-challenge-app.firebasestorage.app",
      messagingSenderId: "163888513221",
      appId: "1:163888513221:web:9646f7d215cf3b0822b0ac",
      measurementId: "G-MLVZSXG02E"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loadingState = document.getElementById("loadingState");
    const errorState = document.getElementById("errorState");
    const leaderboardContent = document.getElementById("leaderboardContent");
    const emptyState = document.getElementById("emptyState");

    const THIRTY_DAYS_MS = 30 * 24 * 60 * 60 * 1000;

    function showError(message) {
      loadingState.classList.remove("show");
      leaderboardContent.style.display = "none";
      emptyState.style.display = "none";
      errorState.classList.add("show");
      errorState.textContent = message;
    }

    function sortUsers(users) {
      return users.sort((a, b) => {
        if (b.completedCount !== a.completedCount) {
          return b.completedCount - a.completedCount;
        }

        if (b.currentChallenge !== a.currentChallenge) {
          return b.currentChallenge - a.currentChallenge;
        }

        return a.name.localeCompare(b.name);
      });
    }

    function assignDenseRanks(users) {
      let currentRank = 0;
      let previousKey = null;

      return users.map((user) => {
        const key = `${user.completedCount}-${user.currentChallenge}`;

        if (key !== previousKey) {
          currentRank += 1;
          previousKey = key;
        }

        return {
          ...user,
          rank: currentRank
        };
      });
    }

    function isActiveRun(programStartDate) {
      if (!programStartDate) return false;

      const now = Date.now();
      const start = programStartDate.getTime();
      return now - start <= THIRTY_DAYS_MS;
    }

    function renderLeaderboard(users) {
      const existingRows = leaderboardContent.querySelectorAll(".leader-row");
      existingRows.forEach(row => row.remove());

      if (!users.length) {
        leaderboardContent.style.display = "none";
        emptyState.style.display = "block";
        loadingState.classList.remove("show");
        return;
      }

      emptyState.style.display = "none";

      const rankedUsers = assignDenseRanks(sortUsers(users));

      rankedUsers.forEach(user => {
        const row = document.createElement("div");
        row.className = "leader-row";

        row.innerHTML = `
          <div class="rank">#${user.rank}</div>
          <div class="name">${user.name}</div>
          <div class="metric">${user.completedCount}</div>
          <div class="metric">Challenge ${user.currentChallenge}</div>
        `;

        leaderboardContent.appendChild(row);
      });

      loadingState.classList.remove("show");
      errorState.classList.remove("show");
      leaderboardContent.style.display = "grid";
    }

    async function loadLeaderboard() {
      const snapshot = await getDocs(collection(db, "users"));

      const users = snapshot.docs
        .map(docSnap => {
          const data = docSnap.data();

          let programStartDate = null;
          if (data.programStartDate?.toDate) {
            programStartDate = data.programStartDate.toDate();
          }

          return {
            name: data.name && String(data.name).trim() ? String(data.name).trim() : "Creator",
            completedCount: Number.isFinite(data.completedCount) ? data.completedCount : 0,
            currentChallenge: Number.isFinite(data.currentChallenge) ? data.currentChallenge : 1,
            programStartDate
          };
        })
        .filter(user => isActiveRun(user.programStartDate));

      renderLeaderboard(users);
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "./index.html";
        return;
      }

      try {
        await loadLeaderboard();
      } catch (error) {
        console.error(error);
        showError("Something went wrong loading the leaderboard.");
      }
    });
  </script>
</body>
</html>
