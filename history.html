<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mycreativehq | History</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --cream: #fcfaf5;
      --warm-white: #fffdf9;
      --vanilla: #f6f1e8;
      --lavender: #e9e0fb;
      --blush: #ffe4da;
      --sky: #e3efff;

      --green: #8caf49;
      --green-dark: #789845;
      --green-soft: rgba(140, 175, 73, 0.14);

      --ink: #161616;
      --text: #4b4b4b;
      --muted: #757575;

      --glass: rgba(255, 255, 255, 0.68);
      --border: rgba(255, 255, 255, 0.82);
      --shadow: 0 24px 60px rgba(92, 74, 112, 0.08);

      --nav-bg: rgba(255, 255, 255, 0.8);

      --success-bg: rgba(140, 175, 73, 0.14);
      --success-text: #58722f;
      --overdue-bg: rgba(255, 231, 226, 0.84);
      --overdue-text: #944838;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: "Inter", sans-serif;
      color: var(--text);
      min-height: 100vh;
      padding: 28px 24px 120px;
      overflow-x: hidden;
      position: relative;
      background:
        radial-gradient(circle at 10% 16%, rgba(255,255,255,0.92), transparent 24%),
        radial-gradient(circle at 88% 14%, rgba(233,224,251,0.76), transparent 20%),
        radial-gradient(circle at 84% 82%, rgba(255,228,218,0.72), transparent 18%),
        radial-gradient(circle at 16% 82%, rgba(227,239,255,0.72), transparent 18%),
        linear-gradient(145deg, var(--cream) 0%, var(--vanilla) 100%);
    }

    .ambient {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 999px;
      filter: blur(36px);
      opacity: 0.72;
    }

    .blob-1 {
      width: 260px;
      height: 260px;
      background: rgba(233, 224, 251, 0.62);
      top: 18px;
      left: 10px;
    }

    .blob-2 {
      width: 240px;
      height: 240px;
      background: rgba(255, 228, 218, 0.58);
      top: 80px;
      right: 80px;
    }

    .blob-3 {
      width: 220px;
      height: 220px;
      background: rgba(227, 239, 255, 0.6);
      bottom: 80px;
      left: 80px;
    }

    .blob-4 {
      width: 280px;
      height: 280px;
      background: rgba(255, 255, 255, 0.74);
      bottom: 10px;
      right: 20px;
    }

    .app {
      position: relative;
      z-index: 1;
      max-width: 820px;
      margin: 0 auto;
    }

    .topbar {
      margin-bottom: 24px;
    }

    .brand {
      margin: 0 0 10px;
      font-family: "Instrument Serif", serif;
      font-size: 28px;
      line-height: 1;
      color: #4e6132;
      letter-spacing: 0.01em;
    }

    .eyebrow {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(22,22,22,0.46);
    }

    .page-title {
      margin: 0;
      font-size: clamp(42px, 5vw, 74px);
      line-height: 0.94;
      letter-spacing: -0.055em;
      color: var(--ink);
      max-width: 720px;
    }

    .welcome {
      margin: 16px 0 0;
      max-width: 760px;
      font-size: 21px;
      line-height: 1.45;
      color: rgba(22,22,22,0.62);
    }

    .loading,
    .error-state {
      display: none;
      padding: 36px 0;
      font-size: 18px;
      font-weight: 700;
      color: rgba(22,22,22,0.62);
    }

    .loading.show,
    .error-state.show {
      display: block;
    }

    .history-list {
      display: none;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .history-card,
    .empty-card {
      border-radius: 28px;
      padding: 26px 24px;
      background: var(--glass);
      border: 1px solid var(--border);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: var(--shadow);
    }

    .history-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 14px;
    }

    .history-title {
      margin: 0;
      font-size: 26px;
      line-height: 1.05;
      letter-spacing: -0.04em;
      color: var(--ink);
    }

    .history-meta {
      margin: 6px 0 0;
      font-size: 14px;
      line-height: 1.6;
      color: rgba(22,22,22,0.58);
      font-weight: 600;
    }

    .history-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .history-badge.ontime {
      background: var(--success-bg);
      color: var(--success-text);
    }

    .history-badge.overdue {
      background: var(--overdue-bg);
      color: var(--overdue-text);
    }

    .history-link-wrap {
      margin-top: 10px;
      padding-top: 14px;
      border-top: 1px solid rgba(22,22,22,0.08);
    }

    .history-link-label {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(22,22,22,0.44);
    }

    .history-link {
      color: var(--ink);
      font-size: 15px;
      line-height: 1.6;
      word-break: break-word;
    }

    .history-link a {
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .no-link {
      color: rgba(22,22,22,0.5);
      font-style: italic;
    }

    .empty-card {
      color: rgba(22,22,22,0.68);
      line-height: 1.7;
      font-size: 16px;
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      width: min(760px, calc(100% - 24px));
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 12px;
      border-radius: 24px;
      background: var(--nav-bg);
      border: 1px solid rgba(255,255,255,0.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 18px 44px rgba(92, 74, 112, 0.12);
    }

    .nav-link {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      min-height: 58px;
      border-radius: 18px;
      font-size: 14px;
      font-weight: 800;
      color: rgba(22,22,22,0.62);
      background: transparent;
      transition: background 0.2s ease, color 0.2s ease;
      text-align: center;
      padding: 8px;
    }

    .nav-link.active {
      background: var(--green);
      color: #ffffff;
      box-shadow: 0 10px 20px rgba(120, 152, 69, 0.2);
    }

    @media (max-width: 700px) {
      body {
        padding: 18px 16px 110px;
      }

      .page-title {
        font-size: 44px;
      }

      .welcome {
        font-size: 18px;
      }

      .history-top {
        flex-direction: column;
        align-items: flex-start;
      }

      .history-title {
        font-size: 22px;
      }

      .bottom-nav {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="ambient">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <main class="app">
    <section class="topbar">
      <p class="brand">mycreativehq</p>
      <p class="eyebrow">History</p>
      <h1 class="page-title">Your challenge receipts</h1>
      <p class="welcome">
        Every completed challenge lives here, including the links you saved.
      </p>
    </section>

    <div id="loadingState" class="loading show">Loading your history...</div>
    <div id="errorState" class="error-state"></div>

    <section id="historyList" class="history-list"></section>

    <div id="emptyState" class="empty-card" style="display:none;">
      No history yet. Finish a challenge first, then your receipts will stop being imaginary.
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="./dashboard.html" class="nav-link">Dashboard</a>
    <a href="./challenge.html" class="nav-link">Challenge</a>
    <a href="./history.html" class="nav-link active">History</a>
    <a href="./leaderboard.html" class="nav-link">Leaderboard</a>
  </nav>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDJt-uwfTaIC6WDvg8rlhj4GjpsGOis8TM",
      authDomain: "content-challenge-app.firebaseapp.com",
      projectId: "content-challenge-app",
      storageBucket: "content-challenge-app.firebasestorage.app",
      messagingSenderId: "163888513221",
      appId: "1:163888513221:web:9646f7d215cf3b0822b0ac",
      measurementId: "G-MLVZSXG02E"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loadingState = document.getElementById("loadingState");
    const errorState = document.getElementById("errorState");
    const historyList = document.getElementById("historyList");
    const emptyState = document.getElementById("emptyState");

    function showError(message) {
      loadingState.classList.remove("show");
      historyList.style.display = "none";
      emptyState.style.display = "none";
      errorState.classList.add("show");
      errorState.textContent = message;
    }

    function formatDate(value) {
      if (!value) return "Unknown date";

      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "Unknown date";

      return date.toLocaleString(undefined, {
        month: "short",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit"
      });
    }

    function renderHistory(items) {
      historyList.innerHTML = "";

      if (!items.length) {
        loadingState.classList.remove("show");
        historyList.style.display = "none";
        emptyState.style.display = "block";
        return;
      }

      const sortedItems = [...items].sort((a, b) => {
        const aTime = new Date(a.completedAt || 0).getTime();
        const bTime = new Date(b.completedAt || 0).getTime();
        return bTime - aTime;
      });

      sortedItems.forEach(item => {
        const card = document.createElement("article");
        card.className = "history-card";

        const badgeClass = item.wasOverdue ? "overdue" : "ontime";
        const badgeText = item.wasOverdue ? "Completed Late" : "On Time";
        const safeTitle = item.challengeTitle || `Challenge ${item.challengeId || ""}`.trim();
        const safeDate = formatDate(item.completedAt);
        const safeLink = item.link && String(item.link).trim() ? String(item.link).trim() : "";

        card.innerHTML = `
          <div class="history-top">
            <div>
              <h2 class="history-title">${safeTitle}</h2>
              <p class="history-meta">Completed ${safeDate}</p>
            </div>
            <div class="history-badge ${badgeClass}">${badgeText}</div>
          </div>

          <div class="history-link-wrap">
            <p class="history-link-label">Saved link</p>
            <div class="history-link">
              ${
                safeLink
                  ? `<a href="${safeLink}" target="_blank" rel="noopener noreferrer">${safeLink}</a>`
                  : `<span class="no-link">No link saved for this one.</span>`
              }
            </div>
          </div>
        `;

        historyList.appendChild(card);
      });

      loadingState.classList.remove("show");
      errorState.classList.remove("show");
      emptyState.style.display = "none";
      historyList.style.display = "grid";
    }

    async function loadHistory(user) {
      const userRef = doc(db, "users", user.uid);
      const userSnap = await getDoc(userRef);

      if (!userSnap.exists()) {
        showError("We couldn’t find your history. Which is rude, frankly.");
        return;
      }

      const userData = userSnap.data();
      const submissionHistory = Array.isArray(userData.submissionHistory)
        ? userData.submissionHistory
        : [];

      renderHistory(submissionHistory);
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "./index.html";
        return;
      }

      try {
        await loadHistory(user);
      } catch (error) {
        console.error(error);
        showError("Something went wrong loading your history.");
      }
    });
  </script>
</body>
</html>
